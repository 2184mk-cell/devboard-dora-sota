apiVersion: v1
kind: ServiceAccount
metadata:
  name: dora-exporter
  namespace: dora-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dora-exporter
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dora-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dora-exporter
subjects:
  - kind: ServiceAccount
    name: dora-exporter
    namespace: dora-observability
