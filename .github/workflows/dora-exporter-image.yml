name: Build DORA Exporter Image

on:
  push:
    branches: [main, feat/dora-sota-observability]
    paths:
      - 'dora-exporter/**'
      - '.github/workflows/dora-exporter-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./dora-exporter
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devboard-dora-exporter:latest
            ghcr.io/${{ github.repository_owner }}/devboard-dora-exporter:sha-${{ github.sha }}
